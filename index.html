<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Cấu hình PWA cho iOS để hoạt động như App Native -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lịch Âm">
    
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/007aff/ffffff?text=Lich">
    
    <title>Lịch Âm Dương</title>
    
    <!-- Thư viện tính lịch âm -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-muted: #8e8e93;
            --border-color: #e5e5ea;
            --red-color: #ff3b30;
            --blue-color: #007aff;
            --today-bg: #ff3b30;
            --today-text: #ffffff;
            --quote-bg: rgba(142, 142, 147, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-main: #ffffff;
                --text-muted: #98989d;
                --border-color: #38383a;
                --quote-bg: rgba(152, 152, 157, 0.12);
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-top: env(safe-area-inset-top, 40px);
            padding-bottom: 30px;
        }

        /* Header (Tháng & Nút chuyển) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 700;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--blue-color);
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
        }

        /* Lưới lịch */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .weekdays div:first-child, .weekdays div:last-child {
            color: var(--red-color);
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: var(--border-color);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .day {
            background-color: var(--bg-color);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .day.empty {
            background-color: transparent;
        }

        .solar {
            font-size: 20px;
            font-weight: 500;
        }

        .lunar {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .day.weekend .solar {
            color: var(--red-color);
        }

        /* Highlight ngày hôm nay */
        .day.today {
            background-color: transparent;
        }

        .day.today .solar {
            background-color: var(--today-bg);
            color: var(--today-text);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day.today.weekend .solar {
            color: var(--today-text);
        }
        
        .footer-action {
            text-align: center;
            margin-top: 25px;
        }
        
        .footer-action button {
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Khung danh ngôn ở cuối trang */
        .quote-box {
            margin: 25px 20px 10px 20px;
            padding: 16px 20px;
            background-color: var(--quote-bg);
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .quote-box:active {
            opacity: 0.6;
        }

        .quote-text {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-main);
            font-style: italic;
        }

        .quote-author {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button class="nav-btn" id="prevBtn">‹</button>
            <h1 id="monthYear"></h1>
            <button class="nav-btn" id="nextBtn">›</button>
        </div>

        <div class="weekdays">
            <div>CN</div>
            <div>T2</div>
            <div>T3</div>
            <div>T4</div>
            <div>T5</div>
            <div>T6</div>
            <div>T7</div>
        </div>

        <div class="calendar" id="calendar"></div>
        
        <div class="footer-action">
            <button id="todayBtn">Hôm nay</button>
        </div>

        <!-- Khung danh ngôn -->
        <div class="quote-box" id="quoteBox">
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-author" id="quoteAuthor"></div>
        </div>
    </div>

    <script>
        const monthYearEl = document.getElementById('monthYear');
        const calendarEl = document.getElementById('calendar');
        
        let currentDate = new Date();

        function renderCalendar(date) {
            calendarEl.innerHTML = '';
            const year = date.getFullYear();
            const month = date.getMonth();
            
            monthYearEl.textContent = `Tháng ${month + 1}, ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day empty';
                calendarEl.appendChild(emptyDiv);
            }

            const today = new Date();

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                const cellDate = new Date(year, month, i);
                
                if (cellDate.getDay() === 0 || cellDate.getDay() === 6) {
                    dayDiv.classList.add('weekend');
                }
                
                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayDiv.classList.add('today');
                }

                const lunar = Lunar.fromDate(cellDate);
                let lunarText = lunar.getDay();
                if (lunarText === 1 || i === 1) {
                    lunarText = `${lunar.getDay()}/${lunar.getMonth()}`;
                }

                dayDiv.innerHTML = `
                    <div class="solar">${i}</div>
                    <div class="lunar">${lunarText}</div>
                `;
                calendarEl.appendChild(dayDiv);
            }
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        });
        
        document.getElementById('todayBtn').addEventListener('click', () => {
            currentDate = new Date();
            renderCalendar(currentDate);
        });

        // Danh sách danh ngôn tuyển chọn
        const quotes = [
            { text: "Thời gian là thứ miễn phí, nhưng nó vô giá. Bạn không thể sở hữu nó, nhưng bạn có thể sử dụng nó.", author: "Harvey MacKay" },
            { text: "Đừng đếm ngày tháng, hãy làm cho ngày tháng đếm được.", author: "Muhammad Ali" },
            { text: "Hôm nay là một món quà, đó là lý do vì sao nó được gọi là Present.", author: "Khuyết danh" },
            { text: "Mỗi ngày mới là một cơ hội mới để bạn trở thành phiên bản tốt hơn của chính mình.", author: "Khuyết danh" },
            { text: "Tương lai phụ thuộc vào những gì bạn làm ngày hôm nay.", author: "Mahatma Gandhi" },
            { text: "Hãy sống như thể ngày mai bạn sẽ chết. Hãy học như thể bạn sẽ sống mãi mãi.", author: "Mahatma Gandhi" },
            { text: "Hành trình vạn dặm luôn bắt đầu bằng một bước chân.", author: "Lão Tử" },
            { text: "Cuộc sống không phải là chờ đợi bão giông qua đi, mà là học cách nhảy múa dưới cơn mưa.", author: "Vivian Greene" },
            { text: "Thành công là một hành trình, không phải là đích đến.", author: "Arthur Ashe" },
            { text: "Hạnh phúc không phải là điểm đến, mà là một hành trình.", author: "Roy M. Goodman" },
            { text: "Mặt trời luôn mọc lại sau đêm dài.", author: "Tục ngữ" },
            { text: "Chỉ cần bạn không dừng lại, việc bạn đi chậm thế nào không quan trọng.", author: "Khổng Tử" },
            { text: "Tất cả chúng ta đều có hai cuộc đời. Cuộc đời thứ hai bắt đầu khi ta nhận ra ta chỉ có một cuộc đời.", author: "Khổng Tử" },
            { text: "Gieo hành vi, gặt thói quen. Gieo thói quen, gặt tính cách. Gieo tính cách, gặt số phận.", author: "William James" },
            { text: "Kỷ luật là cầu nối giữa mục tiêu và thành tựu.", author: "Jim Rohn" }
        ];

        function showRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const quote = quotes[randomIndex];
            document.getElementById('quoteText').textContent = `“${quote.text}”`;
            document.getElementById('quoteAuthor').textContent = quote.author ? `— ${quote.author}` : '';
        }

        // Chạm vào khung để đổi câu khác
        document.getElementById('quoteBox').addEventListener('click', showRandomQuote);

        // Khởi tạo
        renderCalendar(currentDate);
        showRandomQuote();
    </script>
</body>
</html>
